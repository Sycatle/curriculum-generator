services:
  postgres:
    image: postgres:16-alpine
    container_name: cv-generator-postgres-dev
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    ports:
      - "5435:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
