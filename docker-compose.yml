services:
  app:
    image: ${IMAGE:-ghcr.io/sycatle/cv-generator:latest}
    container_name: cv-generator-app
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: cv-generator-postgres
    env_file:
      - .env.postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cron:
    image: alpine:3.20
    container_name: cv-generator-cron
    env_file:
      - .env.production
    depends_on:
      - app
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          sleep 3600
          curl -sf -m 300 -X POST \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://app:3000/api/cron/refresh-sources || true
        done

  caddy:
    image: caddy:2-alpine
    container_name: cv-generator-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-cv.example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
